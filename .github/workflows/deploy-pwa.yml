name: Deploy PWA to GitHub Pages

# Publica pwa/ (la PWA de captura de boletas para celular) en GitHub Pages.
# Son archivos estáticos, sin paso de build — se suben tal cual.
#
# Requisito de configuración (una sola vez, manual): en el repo, Settings ->
# Pages -> "Build and deployment" -> Source: "GitHub Actions". Sin eso, este
# workflow corre pero no hay dónde publicar el resultado.

on:
  push:
    branches: [main]
    paths:
      - "pwa/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch: # permite disparar el deploy a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir pwa/ como artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
