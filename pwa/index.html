<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8C1D40" />
  <title>ParserBoletas — Captura</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Boletas" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body x-data="parserBoletasApp()" x-init="init()">

  <!-- Header: distinto en la lista de colecciones vs. el detalle -->
  <header class="topbar" x-show="view === 'detail'" x-cloak>
    <button class="topbar-back" @click="goToCollections()">&larr; Colecciones</button>
    <span class="topbar-title" x-text="activeCollection ? activeCollection.name : ''"></span>
  </header>

  <main>
    <template x-if="view === 'collections'">
      <div>
        <div class="topbar-eyebrow" style="margin: 4px 0 6px;">
          <span class="accent-bar"></span>
          Captura de boletas
        </div>
        <h1 class="section-title">Mis colecciones</h1>

        <div class="banner banner-info" x-show="showInstallHint" x-cloak>
          <span>
            Para usarla sin conexión y desde la pantalla de inicio: en Safari tocá
            <strong>Compartir</strong> &rarr; <strong>Agregar a inicio</strong>.
          </span>
          <button @click="showInstallHint = false" aria-label="Cerrar">&times;</button>
        </div>

        <div class="banner banner-error" x-show="error" x-cloak x-text="error"></div>

        <div class="card">
          <h2>Nueva colección</h2>
          <p class="hint">Un nombre por viaje o motivo — ej. "Viaje Lima Julio 2026".</p>
          <input
            type="text"
            x-model="newCollectionName"
            @keydown.enter="createCollection()"
            placeholder="Nombre de la colección"
          />
          <button
            class="btn btn-primary"
            @click="createCollection()"
            :disabled="!newCollectionName.trim() || creatingCollection"
          >
            <span x-show="!creatingCollection">Crear</span>
            <span x-show="creatingCollection" x-cloak>Creando…</span>
          </button>
        </div>

        <div class="card">
          <h2>Colecciones</h2>
          <p class="empty-state" x-show="!loadingCollections && !collections.length" x-cloak>
            Todavía no creaste ninguna colección.
          </p>
          <ul class="collection-list" x-show="collections.length" x-cloak>
            <template x-for="c in collections" :key="c.id">
              <li @click="openCollection(c.id)">
                <div>
                  <div class="name" x-text="c.name"></div>
                  <div class="meta">
                    <span x-text="c.receiptCount"></span> boleta(s)
                  </div>
                </div>
                <button class="icon-button" @click="deleteCollection(c.id, $event)" aria-label="Eliminar colección">
                  &times;
                </button>
              </li>
            </template>
          </ul>
        </div>
      </div>
    </template>

    <template x-if="view === 'detail' && activeCollection">
      <div>
        <div class="banner banner-error" x-show="error" x-cloak x-text="error"></div>

        <p class="eviction-hint">
          El celular es un lugar de paso: exportá esta colección relativamente pronto después de
          cargarla — iOS puede borrar los datos de la app si pasa mucho tiempo sin usarla.
        </p>

        <div class="receipt-grid">
          <template x-for="receipt in receipts" :key="receipt.id">
            <div class="receipt-item">
              <div class="receipt-thumb">
                <img :src="receiptUrl(receipt)" alt="Boleta" />
                <button class="remove" @click="deleteReceipt(receipt.id)" aria-label="Eliminar boleta">&times;</button>
              </div>
              <button class="receipt-name" @click="renameReceipt(receipt)" x-text="stemOf(receipt.filename)"></button>
            </div>
          </template>
          <template x-for="n in processingCount" :key="'processing-' + n">
            <div class="receipt-item">
              <div class="receipt-thumb processing">Procesando…</div>
            </div>
          </template>
        </div>

        <p class="empty-state" x-show="!receipts.length && !processingCount" x-cloak>
          Todavía no agregaste boletas a esta colección.
        </p>
      </div>
    </template>
  </main>

  <div class="toast" x-show="toast" x-cloak x-text="toast"></div>

  <!-- Barra de acciones fija, solo en el detalle de una colección — alcanzable
       con el pulgar mientras se van sacando fotos una atrás de otra. -->
  <div class="action-bar" x-show="view === 'detail'" x-cloak>
    <button class="btn" @click="$refs.cameraInput.click()">Tomar foto</button>
    <button class="btn" @click="$refs.galleryInput.click()">Galería</button>
    <button class="btn btn-primary" @click="exportCollection()" :disabled="exporting || !receipts.length">
      <span x-show="!exporting">Exportar</span>
      <span x-show="exporting" x-cloak>Exportando…</span>
    </button>
  </div>

  <input
    x-ref="cameraInput"
    type="file"
    accept="image/*"
    capture="environment"
    class="hidden"
    @change="onCameraFilesChosen($event)"
  />
  <input
    x-ref="galleryInput"
    type="file"
    accept="image/*"
    multiple
    class="hidden"
    @change="onFilesChosen($event)"
  />

  <script src="./vendor/jszip.min.js"></script>
  <script src="./js/db.js"></script>
  <script src="./js/capture.js"></script>
  <script src="./js/export-zip.js"></script>
  <script src="./js/app.js"></script>
  <script src="./vendor/alpine.min.js" defer></script>
</body>
</html>
